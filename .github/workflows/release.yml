name: Release

on:
  push:
    tags: ["v*"]
  # Lets the whole thing be rehearsed without cutting a tag: it builds and checks, and
  # only skips the publish step.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: linux x86_64
    # 22.04 deliberately, not ubuntu-latest. The binary links against the builder's glibc,
    # and 24.04 would stamp a 2.39 floor on it -- excluding Debian 12, Ubuntu 22.04 and
    # RHEL 9, all perfectly plausible hosts for a GPU box. 22.04 builds to a 2.34 floor.
    #
    # Static musl would be the usual portability answer and is wrong here: ft-man dlopens
    # libnvidia-ml, and a fully static musl binary cannot dlopen, so a musl build would
    # silently lose every piece of GPU telemetry.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web interface
        run: cd web && npm ci && npm run check && npm run build

      # A release must never ship the "frontend not built" placeholder: build.rs embeds it
      # silently, so a Node step that failed halfway would otherwise produce a binary that
      # looks fine until someone opens it.
      - name: Check the web bundle is really there
        run: |
          if [ ! -f web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing; the release would ship the placeholder page" >&2
            exit 1
          fi
          ls -lh web/dist

      # Same pin as ci.yml and mise.toml, so a release is built by the compiler that
      # tested it.
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate   tag: $tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - run: cargo build --release --locked

      - name: Check it runs and demands no more glibc than promised
        run: |
          ./target/release/ft-man --version
          floor="$(objdump -T target/release/ft-man | grep -oE 'GLIBC_[0-9.]+' \
                   | sort -uV | tail -1 | sed 's/GLIBC_//')"
          echo "highest glibc symbol required: $floor"
          # 2.34, not 2.35: RHEL 9 ships 2.34, and the README lists it as supported. Pinning
          # the gate to the number actually promised means the two cannot drift apart -- a
          # toolchain or runner change that raises the floor fails here rather than shipping
          # a binary that will not start on a distro the README claims.
          if [ "$(printf '%s\n2.34\n' "$floor" | sort -V | tail -1)" != "2.34" ]; then
            echo "::error::binary requires glibc $floor, above the 2.34 the README promises" >&2
            exit 1
          fi

      - name: Package
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="ft-man-${ver}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/ft-man README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -lh dist

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256
