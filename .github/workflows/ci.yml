name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # No GPU on the runner. NVML is dlopened at runtime, not linked, so the suite builds
      # and runs without one; anything needing a real device is not part of it.
      - run: cargo test

  msrv:
    name: rust 1.88 (declared MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # check, not test: this job exists to prove the crate still compiles on the version
      # Cargo.toml promises, not to re-run the suite.
      - run: cargo check --all-targets
