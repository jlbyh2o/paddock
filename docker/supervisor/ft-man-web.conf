; ft-man's web interface, kept running for the life of the container.
;
; Unlike freetoken-setup this is a long-lived service, not a one-shot: autorestart=true so
; a crash comes back, and priority runs it after freetoken-setup (100), whose config it
; waits for in ft-man-web.sh rather than trusting start order alone.
[program:ft-man-web]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/ft-man-web.sh
autostart=true
autorestart=true
startsecs=2
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
