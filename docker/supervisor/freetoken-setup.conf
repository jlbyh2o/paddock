; One-shot setup, run by the base image's supervisor at boot.
;
; autorestart=false and startsecs=0 because this exits on purpose: it is not a service,
; it is the /workspace layout and the ft-man config being brought into existence before
; anyone logs in. Supervisor's default would treat a clean exit as a crash and respawn it.
[program:freetoken-setup]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/freetoken-setup.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
