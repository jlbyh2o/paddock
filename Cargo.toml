[package]
name = "ft-man"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal UI for managing FreeToken: models, conversion, serving, tuning, and telemetry"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/jlbyh2o/ft-man-tui"
keywords = ["tui", "freetoken", "llm", "moe", "inference"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sysinfo = "0.37"
nvml-wrapper = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
unicode-width = "0.2"
shell-words = "1"
libc = "0.2"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
